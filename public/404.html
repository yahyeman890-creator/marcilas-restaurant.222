<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Marcilas</title>
    <script>
      // HashRouter uses URL hashes (#/path) so all routes load index.html.
      // This 404 page just redirects back to index.html in the same directory.
      var l = window.location;
      var dir = l.pathname.substring(0, l.pathname.lastIndexOf('/') + 1);
      l.replace(dir + 'index.html' + (l.hash || '#/'));
    </script>
  </head>
  <body></body>
</html>
