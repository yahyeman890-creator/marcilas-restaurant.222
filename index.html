<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Marcilas Restaurant — Food Delivery in Dire Dawa</title>
    <meta name="description" content="Order delicious food online from Marcilas Restaurant in Dire Dawa, Ethiopia. Fast delivery, fresh meals." />
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
    <style>
      #app-loading {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: #f9fafb;
        font-family: system-ui, -apple-system, sans-serif;
        z-index: 9999;
        transition: opacity 0.3s;
      }
      #app-loading.hidden { opacity: 0; pointer-events: none; }
      #app-loading .spinner {
        width: 40px; height: 40px;
        border: 3px solid #fee2e2;
        border-top-color: #dc2626;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #app-error {
        position: fixed; inset: 0;
        display: none;
        align-items: center; justify-content: center;
        background: #fef2f2;
        font-family: system-ui, -apple-system, sans-serif;
        z-index: 10000;
        padding: 1rem;
      }
      #app-error.show { display: flex; }
      #app-error .box {
        max-width: 500px; width: 100%;
        background: white; border-radius: 16px;
        border: 1px solid #fecaca;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        padding: 2rem; text-align: center;
      }
      #app-error h2 { color: #991b1b; font-size: 1.25rem; margin: 0 0 0.5rem; }
      #app-error p { color: #6b7280; font-size: 0.875rem; margin: 0 0 1rem; }
      #app-error pre {
        text-align: left; background: #f9fafb; border-radius: 8px;
        padding: 0.75rem; font-size: 0.75rem; color: #dc2626;
        overflow: auto; max-height: 200px; margin: 0 0 1rem;
        white-space: pre-wrap; word-break: break-word;
      }
      #app-error button {
        background: #dc2626; color: white; border: none;
        border-radius: 12px; padding: 0.625rem 1.5rem;
        font-size: 0.875rem; font-weight: 600; cursor: pointer;
      }
      #app-error button:hover { background: #b91c1c; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="app-loading">
      <div style="text-align:center">
        <div class="spinner" style="margin: 0 auto 1rem"></div>
        <p style="color:#9ca3af;font-size:0.875rem;margin:0">Loading Marcilas...</p>
      </div>
    </div>

    <div id="app-error">
      <div class="box">
        <h2>Something went wrong</h2>
        <p>The app failed to load. Here's what happened:</p>
        <pre id="app-error-msg">Unknown error</pre>
        <button onclick="window.location.reload()">Reload Page</button>
      </div>
    </div>

    <script>
      // Global error handler — catches errors during module evaluation
      window.addEventListener('error', function(e) {
        var msg = e.message || 'Unknown error';
        if (e.filename) msg += '\\n\\nFile: ' + e.filename;
        if (e.lineno) msg += '\\nLine: ' + e.lineno + ':' + e.colno;
        if (e.error && e.error.stack) msg += '\\n\\n' + e.error.stack;
        showError(msg);
      });
      window.addEventListener('unhandledrejection', function(e) {
        var msg = e.reason && e.reason.message ? e.reason.message : String(e.reason || 'Unknown rejection');
        if (e.reason && e.reason.stack) msg += '\\n\\n' + e.reason.stack;
        showError(msg);
      });
      function showError(msg) {
        var loading = document.getElementById('app-loading');
        var error = document.getElementById('app-error');
        var msgEl = document.getElementById('app-error-msg');
        if (loading) loading.classList.add('hidden');
        if (error) error.classList.add('show');
        if (msgEl) msgEl.textContent = msg;
      }
      // Called by React when it successfully renders
      window.__appReady = function() {
        var loading = document.getElementById('app-loading');
        if (loading) loading.classList.add('hidden');
      };
    </script>
    <script type="module" crossorigin src="/src/main.tsx"></script>
  </body>
</html>
